name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: delivery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d delivery_test" --health-interval=5s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5

      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      SESSION_SECRET: ${{ secrets.FASTAPI_SESSION_SECRET }}

      POSTGRES_DB: delivery_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

      REDIS_URL: redis://localhost:6379
      MONGO_URL: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install Poetry
  	    uses: abatilo/actions-poetry@v2
  	    with:
    	    poetry-version: '1.8.2'

      - name: Generate .env for application
        run: |
          cat <<EOF > .env
          SESSION_SECRET=${SESSION_SECRET:-dummy-secret}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_HOST=${POSTGRES_HOST}
          POSTGRES_PORT=${POSTGRES_PORT}
          REDIS_URL=${REDIS_URL}
          MONGO_URL=${MONGO_URL}
          EOF

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run database migrations & seed parcel types
        run: |
          poetry run alembic upgrade head
          poetry run python -m src.db.init_data

      - name: Lint (ruff)
        run: poetry run ruff check . --output-format=github

      - name: Run tests
        run: poetry run pytest -q

