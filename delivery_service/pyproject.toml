[tool.poetry]
name        = "delivery-service"
version     = "0.1.0"
description = "International delivery service backend"
authors     = ["Nikita Ovsyannikov <nik.ovsyannikov94@gmail.com>"]
readme      = "README.md"
packages    = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = "0.115.1"
uvicorn = { extras = ["standard"], version = "0.34.0" }
sqlalchemy = "2.0.40"
psycopg2 = "2.9.10"
pydantic = "2.11.3"
pydantic-settings = "2.8.1"
python-dotenv = "1.1.0"
redis = "5.2.1"
aiohttp = "3.11.16"
motor = "3.7.0"
asyncpg = "0.30.0"
alembic = "1.15.2"
itsdangerous = "2.2.0"
celery = { extras = ["redis"], version = "5.3.6" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
ruff = "^0.11.5"
pre-commit = "^4.2.0"
asgi-lifespan = "^2.1.0"
httpx = "0.28.1"

[tool.ruff]
target-version = "py312"
line-length    = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "D", "RUF"]
ignore = [
  "D203", "D213",
  "E501",
  "I001",
  "D100", "D101", "D102", "D103", "D104", "D106",
  "D400", "D415"
]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
