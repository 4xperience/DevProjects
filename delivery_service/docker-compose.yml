services:
  app:
    build: .
    image: delivery-service
    env_file: .env.docker
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        export PATH=$$PATH:/usr/lib/postgresql/16/bin &&
        until pg_isready -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER; do
          echo 'Waiting for Postgres…';
          sleep 2;
        done &&
        # --- миграции ---
        poetry run alembic upgrade head &&
        # --- сидирование ---
        poetry run python -m src.db.init_data &&
        # --- запуск API ---
        poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000
      "

  celery_worker:
    image: delivery-service
    command: poetry run celery -A src.core.celery_app worker -l info --concurrency=4
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: delivery-service
    command: poetry run celery -A src.core.celery_app beat -l info
    env_file: .env.docker
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:6
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
